<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kalkulator Jarak — Rana</title>

  <link href="./src/output.css" rel="stylesheet">

 <style>

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
  }

  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

</style>

</head>


<body class="bg-black text-white min-h-screen">


  <!-- Navbar -->
  <nav
    class="flex justify-between items-center px-6 py-5 max-w-5xl mx-auto">

    <a
      href="index.html"
      class="text-xl font-bold text-purple-400">

      NA.

    </a>


    <a
      href="index.html"
      class="text-gray-400 hover:text-purple-400">

      Portfolio

    </a>

  </nav>


  <!-- Kalkulator -->
  <main
    class="max-w-5xl mx-auto px-6 py-20">

    <div class="max-w-md mx-auto">

      <p class="text-purple-400 text-sm">
        JAVASCRIPT TASK
      </p>

      <h1 class="text-4xl font-bold mt-3">
        Kalkulator Jarak
      </h1>

      <p class="text-gray-400 mt-3">
        Menghitung jarak berdasarkan kecepatan dan waktu.
      </p>


      <!-- Kecepatan -->
      <div class="mt-8">

        <label
          for="kecepatan"
          class="text-sm text-gray-400">

          Kecepatan (km/jam)

        </label>


        <input
          id="kecepatan"
          type="number"
          min="0"
          step="any"
          placeholder="Masukkan kecepatan"
          onkeydown="blokirInput(event)"
          onwheel="this.blur()"
          class="w-full mt-2 p-3 rounded-xl bg-gray-950
                 border border-gray-700 outline-none
                 focus:border-purple-500">

      </div>


      <!-- Jam -->
      <div class="mt-5">

        <label
          for="jam"
          class="text-sm text-gray-400">

          Waktu (jam)

        </label>


        <input
          id="jam"
          type="number"
          min="0"
          step="1"
          placeholder="Masukkan jam"
          onkeydown="blokirInput(event)"
          onwheel="this.blur()"
          class="w-full mt-2 p-3 rounded-xl bg-gray-950
                 border border-gray-700 outline-none
                 focus:border-purple-500">

      </div>


      <!-- Menit -->
      <div class="mt-5">

        <label
          for="menit"
          class="text-sm text-gray-400">

          Waktu (menit)

        </label>


        <input
          id="menit"
          type="number"
          min="0"
          max="59"
          step="1"
          placeholder="Masukkan menit"
          onkeydown="blokirInput(event)"
          onwheel="this.blur()"
          class="w-full mt-2 p-3 rounded-xl bg-gray-950
                 border border-gray-700 outline-none
                 focus:border-purple-500">

      </div>


      <!-- Button -->
      <button
        onclick="hitungJarak()"
        class="w-full mt-6 p-3 rounded-xl bg-purple-600
               hover:bg-purple-700 font-semibold">

        Hitung Jarak

      </button>


      <!-- Hasil -->
      <div
        id="hasil"
        class="mt-6 text-center text-purple-400 font-bold">
      </div>

    </div>

  </main>


  <!-- Footer -->
  <footer
    class="text-center border-t border-gray-800 py-6
           text-gray-500 text-sm">

    © 2026 Rana Atikah Mawarni

  </footer>


  <!-- JavaScript -->
  <script>

    function blokirInput(event) {

      if (
        event.key === "-" ||
        event.key === "+" ||
        event.key === "e" ||
        event.key === "E" ||
        event.key === "PageUp" ||
        event.key === "PageDown" ||
        event.key === "ArrowUp" ||
        event.key === "ArrowDown"
      ) {

        event.preventDefault();

      }

    }


    function hitungJarak() {

      const kecepatan =
        parseFloat(
          document.getElementById("kecepatan").value
        );


      const jamInput =
        document.getElementById("jam").value;


      const menitInput =
        document.getElementById("menit").value;


      const jam =
        jamInput === ""
          ? 0
          : parseFloat(jamInput);


      const menit =
        menitInput === ""
          ? 0
          : parseFloat(menitInput);


      const hasil =
        document.getElementById("hasil");


      if (isNaN(kecepatan)) {

        hasil.textContent =
          "Masukkan kecepatan terlebih dahulu.";

        return;

      }


      if (kecepatan < 0) {

        hasil.textContent =
          "Kecepatan tidak boleh negatif.";

        return;

      }


      if (jam === 0 && menit === 0) {

        hasil.textContent =
          "Masukkan waktu terlebih dahulu.";

        return;

      }


      if (menit < 0 || menit > 59) {

        hasil.textContent =
          "Menit harus berada di antara 0 - 59.";

        return;

      }


      const waktu =
        jam + (menit / 60);


      const jarak =
        kecepatan * waktu;


      hasil.textContent =
        "Jarak = " + jarak.toFixed(2) + " km";

    }

  </script>


</body>

</html>
